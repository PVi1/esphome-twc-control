substitutions:
  device_name: "twc-control"
  friendly_name: "TWC Charge Control"

  # --- RS485 wiring (Waveshare ESP32-S3-RS485-CAN) ---
  tx_pin: GPIO17
  rx_pin: GPIO18
  flow_control_pin: GPIO21
  baud_rate: "115200"

  # --- Calibration -- TWO different breakers, do not mix them up! Live in
  #     secrets.yaml -- the exact amperage of your installation's breakers
  #     is site-specific info, kept out of the published config. ---
  # TWC sub-circuit breaker / internal limit set in the Tesla installer menu
  # for TWC3 (Home Load Management) -- must match exactly, otherwise the
  # limit will be offset.
  twc_breaker_limit_a: !secret twc_breaker_limit_a
  # Main incomer breaker (the one measured by the Shelly Pro 3EM on the main
  # feed). Can be higher than twc_breaker_limit_a -- the car will be limited
  # by whichever of the two is lower.
  main_breaker_limit_a: !secret main_breaker_limit_a

  # --- Real per-phase current/power (Shelly Pro 3EM on the main incomer,
  #     measures EVERYTHING including the TWC branch), mirrored in from HA
  #     entities -- see the "sensor: platform: homeassistant" block below.
  #     HA is a hard dependency for this: if the API connection or the HA
  #     entities go stale, we fail safe (see recompute_ct). ---
  # Availability is driven by HA's OWN "unavailable"/"unknown" state for
  # each entity (see recompute_ct), NOT a fixed no-update timeout -- a
  # timeout can't tell "Shelly is offline" apart from "the load just isn't
  # changing", which caused false staleness during genuinely stable load.
  # This debounce only guards against a real HA-reported outage flapping
  # (e.g. Shelly on a powerline/mesh link with brief dropouts) -- give HA
  # a chance to reconnect on its own before we react. 10s covers typical
  # powerline/WiFi hiccups without leaving a genuine outage unprotected
  # for long.
  shelly_unavailable_debounce_ms: "10000"
  recompute_interval: "1000ms"        # periodic safety-net recompute, independent of HA pushes

  # --- Publication law (see recompute_ct) ---
  # TWC3 FW 26.26.1 ignores "reported" below its own configured breaker
  # limit entirely (dead-band from a stopped state; once charging, it
  # holds exactly at the limit) and only reacts once "reported" crosses
  # the limit by a margin -- confirmed live, consistently ~1.1-1.2A above
  # twc_breaker_limit_a, across multiple independent trials and two
  # different HA data sources (see MEMORY.md / project notes). Below the
  # limit, reported must still track the actual (worst-phase) current 1:1
  # -- diluting that slope (e.g. a gain applied everywhere, tried and
  # reverted) doesn't help control (TWC ignores the exact value below the
  # limit anyway) and only risks a live-correlation distrust latch or
  # blocking the very first minimum-current start check.
  #
  # This design -- worst-phase symmetric publish, gain=1 below the limit,
  # a compressed-and-capped excess above it, an ASYMMETRIC anti-glitch
  # firewall (rises trusted immediately, drops need 2-sample confirmation),
  # dither, and a hard floor at the car's own measured draw applied to the
  # INPUT signal -- is adapted from an independently-developed,
  # live-validated solution to the identical TWC3 FW behavior:
  # https://github.com/zany92/tesla-loadpilot
  # (esphome/packages/twc-core.yaml, verified against the actual source,
  # not just its docs/AI_KNOWLEDGE.md summary -- an earlier version of
  # this file implemented a "decaying tail" the summary described, which
  # does NOT actually exist in the real code and caused a real bug here:
  # confirmed live, it could push reported 2A+ past the limit in a single
  # step, well past excess_max_a, and appears to have caused TWC3 to
  # abort the session (contactor open) rather than just throttle, during
  # exactly the fast multi-phase-engagement startup window. Removed.
  #
  # excess_gain: compresses how much of the raw over-limit amount actually
  # gets published, once ALREADY above the limit -- never applied below
  # it (see above).
  excess_gain: "0.75"
  # excess_max_a: hard ceiling on how far "reported" climbs past
  # twc_breaker_limit_a via this compression -- kept close to (not below)
  # the confirmed ~1.1-1.2A reaction margin, so the law can actually reach
  # the point TWC3 reacts to without needlessly overshooting further.
  excess_max_a: "1.2"
  # law_nudge_min_a: floor on the compressed excess whenever above the
  # limit at all. Confirmed live: TWC3's threshold reaction has TWO
  # distinct bands, not one -- reported in (twc_breaker, twc_breaker+~1.1)
  # only makes TWC3 STOP INCREASING the car's current (a "hold", observed
  # sitting flat for minutes at a fixed current); it takes crossing
  # ~1.1A past the limit before TWC3 actually DECREASES it. A small
  # graduated nudge (originally 0.1A, matching the reference project's
  # own minimum) spends real time sitting ineffectively in that "hold"
  # band whenever a genuine deficit needs correcting -- confirmed live,
  # reported=20.9 (twc_breaker=20) left the car flat at its current
  # draw with a real, uncorrected ~330W/1.2A grid import persisting.
  # Raised to jump straight to the confirmed-effective band the moment
  # any correction is actually needed, instead of lingering in the
  # hold band first.
  law_nudge_min_a: "1.1"
  # desired_avail_slew_down_a_per_s: max rate DESIRED_AVAIL is allowed to
  # DECREASE per second (our "budget"/target-setting term). In the
  # reference project, "budget" is a fixed/slow-changing external quantity
  # (contract limit) or, when made dynamic via their HA orchestration
  # layer, explicitly rate-limited there (10s tick, <=0.5A/tick decay) --
  # kept separate from the FAST worst-phase tracking that needs 1:1
  # correlation. Our desired_avail was instead recomputed from raw live
  # Shelly/vitals data every fast cycle, with no such separation.
  # Confirmed live: Shelly and TWC3's own vitals API are two
  # independently-polled sources that can briefly disagree by several
  # amps during a fast multi-phase engagement (vitals lagging behind a
  # newly-engaged phase's real draw) -- this fed straight into
  # desired_avail, spiking o_raw/pub right at the critical startup
  # window and appears to have caused TWC3 to abort the session. Slew-
  # limiting DECREASES keeps it a genuinely slow-moving operating point
  # again, absorbing sub-second desync noise from either source while
  # still tracking real, sustained solar/household changes over seconds
  # just fine.
  desired_avail_slew_down_a_per_s: "1.0"
  # desired_avail_slew_up_a_per_s: requested explicitly, asymmetric from
  # the down-rate above. Confirmed live: a brief passing cloud (a few
  # seconds) pushed a real, genuine deficit -- worst (unslowed, tracks
  # real current 1:1) spiked immediately, but once the cloud actually
  # PASSED and real conditions recovered, desired_avail (and therefore
  # bias_offset/o_raw/pub) only recovered at the same cautious 1A/s,
  # leaving pub pinned in the excess band for several seconds after the
  # real disturbance was already over. TWC3 appears to tolerate a BRIEF
  # excess indication with a graceful reduction, but a SUSTAINED one
  # (even if only sustained by our own slow recovery, not by reality)
  # gets a hard stop instead. Recovering (desired_avail increasing) is
  # protective the same way every other "rises stay instant" mechanism
  # in this file is (anti-glitch firewall, release-rate limiter) -- only
  # the DECREASE direction needs caution against desync noise.
  desired_avail_slew_up_a_per_s: "10.0"
  # post_correction_hold_ms: requested explicitly, to stop a rapid
  # oscillation observed live -- after a correction (o_raw crosses the
  # limit, forcing pub into the effective ~+1.1A band and confirmed to
  # make TWC3 reduce the car's current), the release-rate limiter's
  # "snap to twc_breaker" step only lasted ONE cycle before continuing
  # its normal slow release below the limit -- the car immediately
  # ramped back up in response (seeing plenty of room again), crossing
  # the limit again within seconds, causing a tight repeating cycle
  # (~1-2s period) between the excess band and just-under-the-limit.
  # Now holds pub pinned at exactly twc_breaker_limit_a (not below) for
  # this long after the LAST time a correction was needed, before
  # resuming the normal slow release underneath it.
  post_correction_hold_ms: "60000"   # 1 minute
  # min_charge_current_a / grace_vitals_threshold_a: requested explicitly,
  # to cut down on contactor cycling (mechanical wear) from brief
  # transient surplus dips (a passing cloud). See the grace_active block
  # in recompute_ct for the full rationale and two earlier attempts that
  # didn't work. The natural o_raw/pub signal is never modified by this
  # (real regulation/grid-avoidance stays fully intact) -- these are only
  # used to CONFIRM via vitals that TWC3 has already throttled the car
  # down near its own minimum in response to that natural signal, which
  # is the only condition under which our own forced escalation gets
  # suppressed (for up to number.*_low_surplus_grace_period, HA-adjustable
  # -- see the number: section below).
  #
  # min_charge_current_a (5A) is TWC3's own documented minimum charge
  # current, kept as a reference value. grace_vitals_threshold_a is the
  # actual detection threshold used against vitals_vehicle_current --
  # confirmed live, the car's real observed minimum under load can sit
  # a bit above the nominal 5A (observed ~6A), so the detection margin
  # is set higher than min_charge_current_a itself to actually catch it.
  min_charge_current_a: "5.0"
  grace_vitals_threshold_a: "7.0"
  # dither: small always-on alternation so "reported" is never perfectly
  # static for long, even at rest/fail-safe -- a genuinely static value
  # was independently identified (both by us and by the reference
  # project) as a distrust-latch risk.
  dither_amplitude_a: "0.05"

  # --- Anti-glitch firewall (per-phase real current, see the on_value
  #     handlers below) -- ASYMMETRIC per the reference project: a RISE
  #     (or a gentle drop within glitch_drop_a) is trusted immediately
  #     (zero latency); a SUDDEN drop >= glitch_drop_a is held at the last
  #     trusted value until 2 consecutive samples agree on a new value
  #     within glitch_confirm_tol_a of each other. Confirmed live: a
  #     single stale/desynced Shelly sample dropped >4A in <10ms right
  #     during a fast multi-phase engagement (physically impossible for a
  #     real ramp), producing a nonsensical household value that
  #     destabilized "reported" during exactly the critical startup
  #     window. ---
  glitch_drop_a: "3.0"
  glitch_confirm_tol_a: "1.0"

  # Escalation (secondary safety net, underneath the publication law
  # above) -- a 2-stage STEP function (per the reference project, not a
  # continuous ramp): if o_raw stays above twc_breaker_limit_a
  # continuously for escalation_timeout_ms, force reported up to at least
  # the law's own minimum nudge; if it's STILL there after
  # 2*escalation_timeout_ms, force it up to escalation_kick_a -- a harder
  # kick, safely past the confirmed ~1.1-1.2A reaction margin.
  escalation_timeout_ms: "120000"
  escalation_kick_a: "1.5"

  # HA entity IDs (live in secrets.yaml, not published -- entity IDs can
  # reveal LAN/device naming and household setup)
  ha_current_a_entity: !secret ha_current_a_entity
  ha_current_b_entity: !secret ha_current_b_entity
  ha_current_c_entity: !secret ha_current_c_entity
  ha_power_a_entity: !secret ha_power_a_entity
  ha_power_b_entity: !secret ha_power_b_entity
  ha_power_c_entity: !secret ha_power_c_entity
  ha_charge_from_grid_entity: !secret ha_charge_from_grid_entity

  # --- TWC3's own local vitals API (diagnostic only, does not drive
  #     control) -- ground-truth of what TWC3 is actually doing
  #     (currentA/B/C_a, vehicle_current_a, contactor_closed), independent
  #     of Shelly/HA, for correlating against "reported" and Shelly's real
  #     currents while tuning the control algorithm. ---
  twc_vitals_ip: !secret twc_vitals_ip
  twc_vitals_poll_interval: "2000ms"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2025.6.0

# USB-C is used for logs/flashing (native USB), RS485 runs on a separate UART1 (GPIO17/18) -> logger doesn't conflict
logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  # Watchdog: without an HA connection we can't trust the mirrored
  # charge_from_grid either (it could be a stale value) -> fail-safe to 0A.
  #
  # IMPORTANT: on_client_connected/disconnected fire for EVERY API client,
  # not just HA -- a diagnostic `esphome logs` session is a second client.
  # Naively setting ha_api_connected straight from the callback meant any
  # logs session disconnecting (e.g. a timeout) incorrectly tripped
  # fail-safe even while HA's own connection was still up -- confirmed
  # live (reported pinned at the breaker limit right when a logs session
  # ended). Track a client COUNT instead: only false once the last
  # connected client (of any kind) actually disconnects.
  on_client_disconnected:
    - lambda: |-
        if (id(api_client_count) > 0) id(api_client_count)--;
        ESP_LOGW("watchdog", "API client '%s' disconnected (%d remaining)", client_info.c_str(), id(api_client_count));
        id(ha_api_connected) = (id(api_client_count) > 0);
    - script.execute: recompute_ct
  on_client_connected:
    - lambda: |-
        id(api_client_count)++;
        id(ha_api_connected) = true;
    - logger.log:
        format: "API client '%s' connected from %s"
        args: ["client_info.c_str()", "client_address.c_str()"]
    - script.execute: recompute_ct

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Fallback AP in case it fails to connect -> you can still reach it to reflash/fix it
  ap:
    ssid: "${friendly_name} Fallback"
    password: !secret ap_password

# Direct poll of TWC3's own /api/1/vitals -- diagnostic ground-truth only,
# does not participate in control (see interval: below).
http_request:
  timeout: 2s

# ---------------------------------------------------------------------------
# State
# ---------------------------------------------------------------------------
globals:
  - id: ha_api_connected
    type: bool
    restore_value: no
    initial_value: "false"      # safe startup: 0A available until HA confirms the connection
  # How many API clients (HA + any diagnostic `esphome logs` sessions,
  # etc.) are currently connected -- see api.on_client_connected/
  # disconnected above. ha_api_connected only goes false once this hits 0.
  - id: api_client_count
    type: int
    restore_value: no
    initial_value: "0"

  - id: ct1_current_a
    type: float
    initial_value: "${twc_breaker_limit_a}"   # on boot, report full consumption = no current available
  - id: ct2_current_a
    type: float
    initial_value: "${twc_breaker_limit_a}"
  - id: ct3_current_a
    type: float
    initial_value: "${twc_breaker_limit_a}"
  - id: ct4_current_a
    type: float
    initial_value: "0.0"
  - id: ct_total_a
    type: float
    initial_value: "0.0"

  - id: ct1_power_w
    type: float
    initial_value: "0.0"
  - id: ct2_power_w
    type: float
    initial_value: "0.0"
  - id: ct3_power_w
    type: float
    initial_value: "0.0"
  - id: ct4_power_w
    type: float
    initial_value: "0.0"
  - id: ct_total_w
    type: float
    initial_value: "0.0"

  # --- TWC3 polling diagnostics (hooked into reading register 0xF4, the
  #     main register TWC3 actually uses to decide the limit) ---
  - id: last_poll_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: poll_interval_ms
    type: float
    restore_value: no
    initial_value: "0.0"

  # --- Escalation timer: how long "reported" has been pinned at the full
  #     breaker limit (0A available) on all 3 phases without a break, see
  #     the escalation block in recompute_ct below. 0 = not currently capped. ---
  - id: capped_since_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # --- Escalation log-once guards (secondary safety net, see recompute_ct)
  #     -- 2-stage step function, so each stage's warning should only log
  #     once per transition, not on every qualifying recompute cycle. ---
  - id: escalation_stage1_logged
    type: bool
    restore_value: no
    initial_value: "false"
  - id: escalation_stage2_logged
    type: bool
    restore_value: no
    initial_value: "false"

  # --- desired_avail slew-rate limiter state (see
  #     desired_avail_slew_down_a_per_s / desired_avail_slew_up_a_per_s above). ---
  - id: desired_avail_prev
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: desired_avail_last_update_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # --- low-surplus grace period state (see number.*_low_surplus_grace_period above) ---
  - id: low_surplus_since_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # --- post-correction hold state (see recompute_ct) ---
  - id: post_correction_hold_until_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: hold_bias_offset
    type: float
    restore_value: no
    initial_value: "0.0"

  # --- TWC3's own vitals (diagnostic only, see twc_vitals_ip above) ---
  - id: twc_vitals_current_a
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: twc_vitals_current_b
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: twc_vitals_current_c
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: twc_vitals_vehicle_current
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: twc_vitals_contactor_closed
    type: bool
    restore_value: no
    initial_value: "false"

  # --- Real per-phase current/power (Shelly Pro 3EM on the main incomer,
  #     includes the TWC branch too), mirrored in from HA entities --
  #     see "sensor: platform: homeassistant" below. ---
  - id: shelly_a_current
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: shelly_b_current
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: shelly_c_current
    type: float
    restore_value: no
    initial_value: "0.0"

  # --- Anti-glitch firewall state, per phase (see glitch_drop_a above and
  #     the glitch guard in each ha_current_a/b/c on_value handler below).
  #     ASYMMETRIC: a rise (or a gentle drop within glitch_drop_a) updates
  #     "trusted" immediately; a sudden drop >= glitch_drop_a is held at
  #     the last trusted value until 2 consecutive samples agree on a new
  #     value within glitch_confirm_tol_a of each other (pending_drop/
  #     confirm_count track that in-progress confirmation). Confirmed
  #     live: a single stale/desynced Shelly sample dropped >4A in <10ms
  #     right during a fast multi-phase engagement (physically impossible
  #     for a real ramp), producing a nonsensical household value that
  #     destabilized "reported" during exactly the critical startup
  #     window and appears to have caused TWC3 to abort the session
  #     (contactor opened) rather than just throttle. ---
  - id: real_a_trusted
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: real_a_pending_drop
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: real_a_confirm_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: real_b_trusted
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: real_b_pending_drop
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: real_b_confirm_count
    type: int
    restore_value: no
    initial_value: "0"
  - id: real_c_trusted
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: real_c_pending_drop
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: real_c_confirm_count
    type: int
    restore_value: no
    initial_value: "0"
  # act_power: negative = export to grid, positive = import from grid (straight from Shelly)
  - id: shelly_a_power
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: shelly_b_power
    type: float
    restore_value: no
    initial_value: "0.0"
  - id: shelly_c_power
    type: float
    restore_value: no
    initial_value: "0.0"
  # last time ANY of the 6 HA-mirrored sensors above pushed a fresh (valid,
  # non-NAN) value -- purely informational (see "Shelly Time Since Last
  # OK"), no longer drives the fail-safe decision, see shelly_*_available below.
  - id: shelly_last_ok_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  # --- Per-entity availability, driven by HA's own "unavailable"/"unknown"
  #     state (see the on_value lambdas below: ESPHome's homeassistant
  #     sensor publishes NAN when the entity's HA state fails to parse as a
  #     number, which is exactly what happens on those 2 states) -- start
  #     false (unavailable) until the first real value arrives. ---
  - id: ha_current_a_available
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ha_current_b_available
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ha_current_c_available
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ha_power_a_available
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ha_power_b_available
    type: bool
    restore_value: no
    initial_value: "false"
  - id: ha_power_c_available
    type: bool
    restore_value: no
    initial_value: "false"
  # 0 = currently fully available; otherwise the millis() timestamp when
  # unavailability (any of the 6 flags above going false) started -- the
  # debounce in recompute_ct only reacts once this has held continuously
  # for shelly_unavailable_debounce_ms.
  - id: shelly_unavailable_since_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

# ---------------------------------------------------------------------------
# Publication law -- see "Publication law" comment block in substitutions
# above for the full design rationale (adapted from
# https://github.com/zany92/tesla-loadpilot, confirmed against our own
# empirical TWC3 FW 26.26.1 testing). Summary:
#
#   desired_avail = <self-balancing target, from HOUSEHOLD-ONLY signal --
#                     TWC3's own vitals API gives us the car's OWN current
#                     directly, subtracted out of Shelly's combined
#                     reading, so this has NO self-referential feedback
#                     and needs no gain damping at all>
#   worst         = max(signed_a, signed_b, signed_c)   (car-INCLUSIVE,
#                     for live 1:1 correlation below the limit)
#   bias_offset   = twc_breaker_limit_a - desired_avail
#   o_raw         = worst + bias_offset
#   pub           = o_raw <= limit ? o_raw
#                     : limit + clamp(excess_gain*(o_raw-limit), 0.1, excess_max_a)
#   pub           = max(pub, <car's own measured current, from vitals>)
#   pub          += tail (decaying anti-oscillation bias) + dither
#   reported_a = reported_b = reported_c = pub   (published SYMMETRICALLY
#                     on all 3 registers -- makes min=mean=max, so TWC3's
#                     own service loop engages at the true constraint
#                     regardless of which phase is actually weakest)
#
# Both breakers (twc_breaker_limit_a AND main_breaker_limit_a) still
# clamp desired_avail before any of the above, protecting both
# simultaneously regardless of mode.
#
# GRID mode: desired_avail = twc_breaker_limit_a (max allowed, subject to
# the same breaker clamps).
#
# FVE mode: desired_avail is the self-balancing target -- averaged across
# phases (aggregate/net billing) or the weakest phase (per-phase billing),
# both from the household-only (car-free) signal, plus the manual
# fve_offset_kw (number.*_fve_offset in HA).
#
# If the HA charge_from_grid entity doesn't have a valid state yet, we
# safely fall back to GRID mode (more conservative, proven to work).
#
# Fail-safe: if any of the 6 HA-mirrored entities has been reporting
# unavailable/unknown continuously for shelly_unavailable_debounce_ms, OR
# the HA API isn't connected (can't trust the mirrored charge_from_grid),
# report full consumption (twc_breaker_limit_a) on all phases = 0A for the car.
# ---------------------------------------------------------------------------
script:
  - id: recompute_ct
    then:
      - lambda: |-
          const float twc_breaker = ${twc_breaker_limit_a};
          const float main_breaker = ${main_breaker_limit_a};
          const float voltage = 230.0f;
          const uint32_t now_ms = millis();

          // Dither -- see dither_amplitude_a above -- computed once,
          // applied everywhere below (including fail-safe/disabled) so
          // "reported" is never perfectly static for long.
          const float dither = ((now_ms / 500) % 2 == 0)
              ? (float)${dither_amplitude_a} : -((float)${dither_amplitude_a});

          // Availability is HA's own signal (see the on_value lambdas
          // below), not a fixed no-update timeout -- debounced so a brief
          // HA-reported outage (e.g. Shelly on a flaky powerline/mesh
          // link) doesn't immediately trip the fail-safe; only a
          // continuous outage past shelly_unavailable_debounce_ms does.
          bool all_available = id(ha_current_a_available) && id(ha_current_b_available) &&
              id(ha_current_c_available) && id(ha_power_a_available) &&
              id(ha_power_b_available) && id(ha_power_c_available);
          if (!all_available) {
            if (id(shelly_unavailable_since_ms) == 0) id(shelly_unavailable_since_ms) = now_ms;
          } else {
            id(shelly_unavailable_since_ms) = 0;
          }
          bool shelly_stale = (id(shelly_unavailable_since_ms) != 0) &&
              (now_ms - id(shelly_unavailable_since_ms) >= (uint32_t)${shelly_unavailable_debounce_ms});

          bool grid_mode = true;
          if (id(charge_from_grid).has_state()) {
            grid_mode = id(charge_from_grid).state;
          }

          float reported_a, reported_b, reported_c;
          if (!id(twc_control_enabled).state) {
            // Deliberately report ~0A (max availability) on all 3 phases
            // instead of computing anything live. TWC3's live correlation
            // check then distrusts this within seconds of a session
            // starting and falls back to its own internal ceiling -- i.e.
            // it ends up ignoring us entirely and charges at whatever it
            // decides on its own, effectively disabling this whole
            // external control loop on purpose.
            reported_a = reported_b = reported_c = 0.0f + dither;
            id(capped_since_ms) = 0;
            id(escalation_stage1_logged) = false;
            id(escalation_stage2_logged) = false;
          } else if (shelly_stale || !id(ha_api_connected)) {
            ESP_LOGW("shelly", "Shelly stale or HA API disconnected, fail-safe to 0A");
            reported_a = reported_b = reported_c = twc_breaker + dither;
          } else {
            // shelly_a/b/c_current already hold the anti-glitch-filtered
            // trusted value -- see the on_value handlers below (filtering
            // happens once, at the point a genuinely new HA sample
            // arrives, not on every recompute_ct call).
            float real_a = id(shelly_a_current);
            float real_b = id(shelly_b_current);
            float real_c = id(shelly_c_current);

            // Manual export-balance offset -- runtime-adjustable from HA
            // (number.*_fve_offset, see below), symmetric across phases.
            // GRID mode ignores it (uses the main-breaker headroom
            // instead). NAN-guarded in case the entity hasn't restored a
            // value yet (falls back to 0 = no offset).
            float fve_offset_kw = id(fve_offset).state;
            if (std::isnan(fve_offset_kw)) fve_offset_kw = 0.0f;
            const float fve_offset_a = fve_offset_kw * 1000.0f / 3.0f / voltage;

            // Signed net grid exchange per phase (positive = import,
            // negative = export) -- floored down only on the export side,
            // so a claimed surplus never slightly overshoots what's real.
            float signed_a = (id(shelly_a_power) < 0.0f) ? -floorf(real_a) : real_a;
            float signed_b = (id(shelly_b_power) < 0.0f) ? -floorf(real_b) : real_b;
            float signed_c = (id(shelly_c_power) < 0.0f) ? -floorf(real_c) : real_c;

            // Household-only signal: TWC3's own vitals API gives us the
            // car's OWN per-phase current directly (twc_vitals_current_a/
            // b/c, see above), so it can be subtracted straight out of
            // Shelly's combined reading -- unlike gain damping (which
            // blunts the WHOLE signal to fight the self-referential
            // feedback loop), this removes the self-reference at its
            // actual source. Falls back to the car-inclusive signal
            // (0.0 default) if vitals hasn't reported yet -- less
            // precise, still correct. IMPORTANT: uses the RAW signed_x
            // (no R1 floor applied -- see below for why).
            float household_a = signed_a - id(twc_vitals_current_a);
            float household_b = signed_b - id(twc_vitals_current_b);
            float household_c = signed_c - id(twc_vitals_current_c);

            // R1 hard floor -- CORRELATION-ONLY, per the reference
            // project: with the car genuinely charging, TWC3's own live
            // ramp-tracking check needs the published "worst" term to
            // read at least as high as what TWC3 itself measures the car
            // drawing, or it may distrust the meter.
            //
            // Confirmed live (bug, now fixed): the floor must NOT feed
            // household_x/desired_avail. It was originally applied to
            // signed_x itself, upstream of household_x -- the moment the
            // car drew current, signed_x collapsed toward
            // vitals_current_x, so household_x = signed_x - vitals_current_x
            // collapsed to ~0 REGARDLESS of real solar export, wiping out
            // the whole budget and choking off every charge attempt (the
            // car's own draw cancelled itself out of its own budget).
            // Confirmed live too: real_a genuinely dropping while
            // vitals_a rose (e.g. 7.97->2.80 as vitals rose 0->5.4) is
            // physically correct -- still net EXPORTING overall, just a
            // smaller surplus -- so signed_a must stay negative (export),
            // never forced toward the car's raw branch current.
            //
            // Confirmed live also: contactor_closed can report true
            // during brief near-zero (0.2-0.4A) self-test/idle blips, not
            // just real charging -- gated on vehicle_current_a >= 2.0A too.
            const bool car_charging = id(twc_vitals_contactor_closed) &&
                (id(twc_vitals_vehicle_current) >= 2.0f);
            float corr_a = signed_a, corr_b = signed_b, corr_c = signed_c;
            if (car_charging) {
              corr_a = std::max(corr_a, id(twc_vitals_current_a));
              corr_b = std::max(corr_b, id(twc_vitals_current_b));
              corr_c = std::max(corr_c, id(twc_vitals_current_c));
            }

            // Desired available current -- how much we WANT the car
            // allowed, from the car-free household signal (no feedback
            // loop, no gain needed here at all).
            float desired_avail;
            if (grid_mode) {
              desired_avail = twc_breaker;
            } else if (id(aggregate_balance_metering).state) {
              // Aggregate/net billing: utility nets import/export across
              // all 3 phases together, so average the household-only
              // availability across all 3.
              desired_avail = ((-household_a + fve_offset_a) +
                                (-household_b + fve_offset_a) +
                                (-household_c + fve_offset_a)) / 3.0f;
            } else {
              // Per-phase billing: the weakest phase is the true
              // constraint.
              desired_avail = std::min(std::min(-household_a + fve_offset_a,
                                                 -household_b + fve_offset_a),
                                        -household_c + fve_offset_a);
            }
            desired_avail = std::min(desired_avail, twc_breaker);

            // Slew-rate limit desired_avail (see desired_avail_slew_down_a_per_s
            // / desired_avail_slew_up_a_per_s above) BEFORE the
            // main-breaker clamp -- that clamp is a hard safety limit and
            // must react instantly/unslowed; only the soft,
            // solar/household-derived target gets smoothed. Asymmetric:
            // decreases stay cautious (desync-noise protection),
            // increases recover fast (a brief cloud shouldn't leave pub
            // pinned in the excess band long after conditions actually
            // recovered -- see desired_avail_slew_up_a_per_s above).
            //
            // Confirmed live (bug, now fixed): starting desired_avail_prev
            // at a fixed 0.0 on boot made desired_avail spend its first
            // several seconds ramping UP from 0 toward the true target,
            // during which the artificially-low desired_avail legitimately
            // computed a HIGH bias_offset -- pushing pub into the excess
            // zone as a pure boot artifact. Fixed by passing the raw
            // value through unlimited on the very first call after boot.
            if (std::isnan(id(desired_avail_prev))) {
              id(desired_avail_prev) = desired_avail;
              id(desired_avail_last_update_ms) = now_ms;
            } else {
              float elapsed_s = (now_ms - id(desired_avail_last_update_ms)) / 1000.0f;
              float delta = desired_avail - id(desired_avail_prev);
              float slew_a_per_s = (delta >= 0.0f)
                  ? (float)${desired_avail_slew_up_a_per_s}
                  : (float)${desired_avail_slew_down_a_per_s};
              float max_delta = slew_a_per_s * std::max(elapsed_s, 0.001f);
              delta = std::max(-max_delta, std::min(max_delta, delta));
              desired_avail = id(desired_avail_prev) + delta;
              id(desired_avail_prev) = desired_avail;
              id(desired_avail_last_update_ms) = now_ms;
            }

            // Main breaker protection, applied AFTER slewing -- instant,
            // never delayed, regardless of mode.
            float avail_main_a = main_breaker - real_a;
            float avail_main_b = main_breaker - real_b;
            float avail_main_c = main_breaker - real_c;
            float avail_main_min = std::min(std::min(avail_main_a, avail_main_b), avail_main_c);
            desired_avail = std::min(desired_avail, avail_main_min);

            // Publication law -- see the comment block above script: for
            // the full design (adapted from
            // https://github.com/zany92/tesla-loadpilot). worst-phase,
            // car-INCLUSIVE signal for live 1:1 correlation below the
            // limit; compressed-and-capped excess above it; published
            // SYMMETRICALLY on all 3 registers.
            float worst = std::max(std::max(corr_a, corr_b), corr_c);
            float bias_offset = twc_breaker - desired_avail;
            // worst is only added while the car is actually drawing
            // current (car_charging) -- that's when reported MUST track
            // 1:1 with TWC3's own ramping current for its live
            // correlation check, or it distrusts the meter. While idle
            // (car_charging=false, nothing to correlate against yet),
            // adding worst just double-counts the household's own
            // baseline (household_x already subtracts it out of
            // desired_avail) and produces an unnecessarily low starting
            // value -- confirmed live, ~4A reported at a genuine 8A/phase
            // export the household-only budget (desired_avail) already
            // supported, and a real Tesla session visibly starting slow
            // (1A/16A target -> ramping to 7A/7A) as a result. Idle,
            // reported is simply bias_offset (breaker - desired_avail)
            // directly -- exactly the weakest-exporting-phase (per-phase
            // mode) or aggregate balance (AGG mode) budget itself.
            float o_raw = car_charging ? (worst + bias_offset) : bias_offset;

            // Low-surplus grace period (see min_charge_current_a /
            // grace_vitals_threshold_a above and number.*_low_surplus_grace_period):
            // requested explicitly, to cut down on contactor cycling
            // (mechanical wear) from brief transient surplus dips (a
            // passing cloud).
            //
            // Confirmed live -- two earlier attempts didn't work:
            // 1) Flooring desired_avail at a fixed 5A: o_raw stayed far
            //    over the limit regardless, since worst (the car's own
            //    real current) alone already exceeded that fixed floor.
            // 2) Capping the PUBLISHED value at exactly twc_breaker
            //    whenever o_raw > breaker: this made our own regulation
            //    ineffective -- capping pub at a value TWC3 fully ignores
            //    stops pressuring it to reduce current AT ALL, so the car
            //    just kept drawing full current from the grid the whole
            //    grace window. Explicitly flagged as unacceptable: the
            //    goal is consuming surplus / avoiding grid import, not
            //    tolerating grid import to avoid a contactor cycle.
            //
            // Fixed by NOT touching o_raw/pub's natural computation at
            // all -- that keeps pressuring TWC3 exactly as before, so
            // real regulation is unaffected. Confirmed live: TWC3
            // reduces the car's own current toward its minimum (~5A) in
            // response to an elevated reported value, rather than always
            // aborting outright. grace_active instead only gates the
            // ESCALATION step below (which would otherwise force
            // reported even further above the limit): once vitals
            // confirms the car has actually throttled down near its own
            // minimum (not assumed -- observed against
            // grace_vitals_threshold_a, not min_charge_current_a itself --
            // see above for why), hold off on forcing it any further for
            // up to number.*_low_surplus_grace_period (HA-adjustable at
            // runtime -- the right duration depends on how long a
            // passing cloud actually takes to clear), giving the car a
            // chance to keep trickling at a reduced rate while conditions
            // hopefully improve, instead of deliberately forcing a full
            // stop. If the car ISN'T near its minimum (still drawing
            // significantly more), grace never engages at all -- the
            // natural signal and escalation proceed exactly as before.
            bool car_near_min = car_charging &&
                (id(twc_vitals_vehicle_current) <= (float)${grace_vitals_threshold_a});
            bool grace_active = false;
            if (!grid_mode && o_raw > twc_breaker && car_near_min) {
              if (id(low_surplus_since_ms) == 0) id(low_surplus_since_ms) = now_ms;
              uint32_t over_for = now_ms - id(low_surplus_since_ms);
              uint32_t grace_ms = (uint32_t)(id(low_surplus_grace_s).state * 1000.0f);
              if (over_for < grace_ms) {
                grace_active = true;
              }
            } else if (o_raw <= twc_breaker) {
              id(low_surplus_since_ms) = 0;
            }

            float pub;
            if (o_raw <= twc_breaker) {
              // Floor at 0: during strong export, worst (a phase's own
              // real current, negative while exporting) plus bias_offset
              // can go negative -- confirmed live (~5975W export -> pub
              // ~-0.1A). A real meter/EVSE current reading is never
              // negative, and reported=0 already signals maximum
              // availability (breaker - 0 = full breaker); anything more
              // negative adds no information, only untested territory for
              // TWC3's own correlation check.
              pub = std::max(o_raw, 0.0f);
            } else {
              float excess = std::min(((float)${excess_gain}) * (o_raw - twc_breaker), (float)${excess_max_a});
              excess = std::max(excess, (float)${law_nudge_min_a});
              pub = twc_breaker + excess;
            }

            // Post-correction hold (requested explicitly, fixes a rapid
            // oscillation confirmed live): right after a correction
            // (o_raw > twc_breaker), letting pub immediately fall back to
            // its natural low value made the car ramp straight back up,
            // re-crossing the limit within seconds (~1-2s repeating
            // cycle, real contactor cycling observed). Refreshed every
            // cycle a correction is actually needed; while within the
            // hold window, pub is floored relative to worst using the
            // bias captured at the LAST correction (hold_bias_offset),
            // not a flat twc_breaker constant.
            //
            // Confirmed live (bug, now fixed): pinning pub at a flat,
            // unmoving twc_breaker for the whole hold window broke
            // TWC3's own correlation check -- its ammeter was observed
            // ramping the car's real current 8->10A while our published
            // value sat perfectly static, which is physically implausible
            // for a real combined-circuit meter (the car's own draw is
            // part of that circuit) and risks the exact distrust/abort
            // reaction the dither mechanism exists to avoid. Session
            // aborted with a real 4.7kW surplus still available. Fixed by
            // tracking worst 1:1 (correlation-safe) instead, only floored
            // at twc_breaker so it can't drop low enough to invite a
            // premature re-ramp.
            //
            // Requested explicitly: once the hold window ends, release
            // immediately -- maximize surplus utilization, don't waste
            // real availability crawling back down at a fixed rate. An
            // earlier version rate-limited every decrease (even ones that
            // never went through a hold at all) at a fixed 0.1A/s, which
            // left reported sitting near the limit for up to ~2 minutes
            // after conditions had already recovered. Removed -- the hold
            // above is what actually prevents oscillation/contactor
            // cycling; a further rate limit on top of it only cost
            // unused surplus, it didn't add any additional safety.
            if (o_raw > twc_breaker) {
              id(post_correction_hold_until_ms) = now_ms + (uint32_t)${post_correction_hold_ms};
              id(hold_bias_offset) = bias_offset;
            }
            if (now_ms < id(post_correction_hold_until_ms)) {
              // Same car_charging gating as o_raw above -- worst only
              // gets added while there's an actual car ramp to correlate
              // with; otherwise it double-counts the household baseline
              // the same way it would in the main o_raw computation.
              float floor_val = std::max(twc_breaker,
                  (car_charging ? worst : 0.0f) + id(hold_bias_offset));
              pub = std::max(pub, floor_val);
            }

            pub += dither;

            reported_a = reported_b = reported_c = pub;

            // DIAGNOSTIC: single-line CSV summary of every decisive value
            // each recompute cycle, for live monitoring via `esphome logs`
            // and machine parsing (grep tag "csv", strip the ESPHome
            // [time][level][tag:line]: prefix, feed the rest to a CSV
            // reader). The header row (field names) is logged once at
            // boot under tag "csv_header", and re-emitted every 5 minutes
            // so a log session started mid-run still sees it once.
            {
              const char *mode_str = grid_mode ? "GRID" :
                  (id(aggregate_balance_metering).state ? "AGG" : "PERPHASE");
              static uint32_t last_header_ms = 0;
              static bool header_sent_once = false;
              if (!header_sent_once || now_ms - last_header_ms >= 300000) {
                header_sent_once = true;
                last_header_ms = now_ms;
                ESP_LOGI("csv_header",
                    "ts_ms,mode,real_a,real_b,real_c,signed_a,signed_b,signed_c,"
                    "corr_a,corr_b,corr_c,household_a,household_b,household_c,"
                    "desired_avail,worst,o_raw,pub,"
                    "fve_offset_kw,vitals_a,vitals_b,vitals_c,vitals_vehicle,contactor_closed,car_charging,grace_active");
              }
              ESP_LOGI("csv",
                  "%u,%s,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%.2f,%d,%d,%d",
                  now_ms, mode_str, real_a, real_b, real_c,
                  signed_a, signed_b, signed_c,
                  corr_a, corr_b, corr_c,
                  household_a, household_b, household_c,
                  desired_avail, worst, o_raw, pub, fve_offset_kw,
                  id(twc_vitals_current_a), id(twc_vitals_current_b), id(twc_vitals_current_c),
                  id(twc_vitals_vehicle_current), id(twc_vitals_contactor_closed) ? 1 : 0,
                  car_charging ? 1 : 0, grace_active ? 1 : 0);
            }

            // Escalation (secondary safety net): a 2-stage STEP function
            // (per the reference project, not a continuous ramp). If
            // o_raw stays above twc_breaker_limit_a continuously for
            // escalation_timeout_ms, force reported up to at least
            // law_nudge_min_a past the limit; if it's STILL there after
            // 2*escalation_timeout_ms, force it up to escalation_kick_a
            // -- a harder kick, safely past the confirmed ~1.1-1.2A
            // reaction margin.
            //
            // Suppressed while grace_active (see above): the car is
            // already confirmed near its own minimum in response to the
            // natural (unmodified) signal -- forcing it even further
            // would only risk a full abort we're deliberately trying to
            // avoid for up to number.*_low_surplus_grace_period.
            if (o_raw > twc_breaker) {
              // capped_since_ms tracks how long o_raw has been over the
              // limit CONTINUOUSLY, regardless of grace -- only the
              // actual forcing below is skipped while grace_active, so
              // the timer isn't reset/restarted by grace suppressing it.
              if (id(capped_since_ms) == 0) id(capped_since_ms) = now_ms;
              uint32_t capped_for = now_ms - id(capped_since_ms);
              if (!grace_active) {
                if (capped_for >= (uint32_t)${escalation_timeout_ms}) {
                  reported_a = reported_b = reported_c = std::max(pub, twc_breaker + (float)${law_nudge_min_a});
                  if (!id(escalation_stage1_logged)) {
                    ESP_LOGW("shelly", "o_raw above limit for escalation_timeout_ms+, forcing past the limit");
                    id(escalation_stage1_logged) = true;
                  }
                }
                if (capped_for >= 2u * (uint32_t)${escalation_timeout_ms}) {
                  reported_a = reported_b = reported_c = std::max(reported_a, twc_breaker + (float)${escalation_kick_a});
                  if (!id(escalation_stage2_logged)) {
                    ESP_LOGW("shelly", "Still above limit after 2x escalation_timeout_ms, escalation_kick_a");
                    id(escalation_stage2_logged) = true;
                  }
                }
              }
            } else {
              id(capped_since_ms) = 0;
              id(escalation_stage1_logged) = false;
              id(escalation_stage2_logged) = false;
            }
          }

          id(ct1_current_a) = reported_a;
          id(ct2_current_a) = reported_b;
          id(ct3_current_a) = reported_c;
          id(ct4_current_a) = 0.0f;
          id(ct_total_a) = id(ct1_current_a) + id(ct2_current_a) + id(ct3_current_a) + id(ct4_current_a);

          id(ct1_power_w) = voltage * id(ct1_current_a);
          id(ct2_power_w) = voltage * id(ct2_current_a);
          id(ct3_power_w) = voltage * id(ct3_current_a);
          id(ct4_power_w) = 0.0f;
          id(ct_total_w) = id(ct1_power_w) + id(ct2_power_w) + id(ct3_power_w) + id(ct4_power_w);

switch:
  # Master switch for the whole external control loop. When OFF,
  # recompute_ct reports a constant 0A (max availability) on all 3 phases
  # instead of computing anything live -- TWC3's own live correlation
  # check then distrusts that static value within seconds of a session
  # starting and falls back to its own internal ceiling, i.e. it ends up
  # ignoring this firmware entirely and charges at whatever it decides on
  # its own. Use this to hand a charging session fully back to TWC3's
  # stock behavior (e.g. the Tesla app's own current slider) without
  # touching the RS485 wiring or reflashing. Default ON -- external
  # control is active by default.
  - platform: template
    id: twc_control_enabled
    name: "TWC Control Enabled"
    icon: "mdi:power-plug-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: recompute_ct
    on_turn_off:
      - script.execute: recompute_ct

  # FVE mode only. When your utility nets import/export across all 3 phases
  # together (aggregate/net billing) rather than settling each phase
  # separately, this averages the household-only (car-free) availability
  # across all 3 phases as the self-balancing target (desired_avail), instead
  # of using the single weakest phase -- see recompute_ct's publication law.
  # Note: "reported" is always published symmetrically on all 3 registers
  # regardless of this setting (required for TWC3's own service loop to
  # engage at the true constraint) -- this switch only changes how
  # desired_avail itself is computed. The per-phase main-breaker safety
  # check still applies underneath it regardless of this setting.
  - platform: template
    id: aggregate_balance_metering
    name: "Aggregate Balance Metering"
    icon: "mdi:swap-horizontal-circle-outline"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# ---------------------------------------------------------------------------
# Runtime-adjustable manual export-balance offset (FVE modes only, see
# recompute_ct). Symmetric across all 3 phases, in kW total (split evenly
# and converted to A internally), applied AFTER self_balance_gain -- direct,
# undiminished A-for-A control, independent of the loop-stability gain.
#
# Positive: artificially IMPROVES the perceived balance -- lets charging
# start/continue even when real production alone falls just short of what
# TWC3's 5A minimum needs.
# Negative: artificially WORSENS it -- reserves a buffer/margin of real
# export that must never go to the car, even while genuinely exporting.
# 0.0 (default) = no offset, unchanged behavior.
#
# Existing safety clamps (main_breaker_limit_a, twc_breaker_limit_a, floor
# at 0) still apply downstream regardless of this value -- it can't be used
# to bypass either breaker's protection, only to shift where the
# self-balancing formula's own zero-point sits.
# ---------------------------------------------------------------------------
number:
  - platform: template
    id: fve_offset
    name: "FVE Offset"
    icon: "mdi:tune-variant"
    unit_of_measurement: "kW"
    min_value: -10.0
    max_value: 10.0
    step: 0.1
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 0.0
    on_value:
      - script.execute: recompute_ct

  # Low-surplus grace period duration (see the grace_active block in
  # recompute_ct) -- requested explicitly to be HA-adjustable at runtime
  # rather than a fixed compile-time constant, since the right duration
  # depends on how long a passing cloud actually takes to clear (observed
  # live: as short as ~12s), not a fixed value that fits every situation.
  - platform: template
    id: low_surplus_grace_s
    name: "Low Surplus Grace Period"
    icon: "mdi:timer-sand"
    unit_of_measurement: "s"
    min_value: 0.0
    max_value: 300.0
    step: 1.0
    mode: box
    optimistic: true
    restore_value: true
    initial_value: 12.0

# ---------------------------------------------------------------------------
# Safety-net recompute: recompute_ct is otherwise ONLY triggered by one of
# the 6 HA-mirrored real-current/power sensors (see "sensor:" below) pushing
# a new value, an API connect/disconnect, or a charge_from_grid change.
# Also the ONLY thing that keeps re-checking the unavailable-debounce timer
# once an entity flips to unavailable and then just stays that way -- that
# on_value fires once on the transition, but nothing else would fire again
# to notice the debounce window has since elapsed. Keep re-checking every
# tick so the fail-safe still kicks in on time.
# ---------------------------------------------------------------------------
interval:
  - interval: ${recompute_interval}
    then:
      - script.execute: recompute_ct

  # Direct poll of TWC3's own /api/1/vitals -- ground truth for the R1
  # hard floor and the household-only signal in recompute_ct (see there),
  # and also exposed as diagnostic sensors for correlating against
  # "reported" and Shelly's real currents.
  - interval: ${twc_vitals_poll_interval}
    then:
      - http_request.get:
          url: "http://${twc_vitals_ip}/api/1/vitals"
          capture_response: true
          on_response:
            then:
              - if:
                  condition:
                    lambda: "return response->status_code == 200;"
                  then:
                    - lambda: |-
                        json::parse_json(body, [](JsonObject root) -> bool {
                          if (root["currentA_a"].is<float>()) id(twc_vitals_current_a) = root["currentA_a"];
                          if (root["currentB_a"].is<float>()) id(twc_vitals_current_b) = root["currentB_a"];
                          if (root["currentC_a"].is<float>()) id(twc_vitals_current_c) = root["currentC_a"];
                          if (root["vehicle_current_a"].is<float>()) id(twc_vitals_vehicle_current) = root["vehicle_current_a"];
                          if (root["contactor_closed"].is<bool>()) id(twc_vitals_contactor_closed) = root["contactor_closed"];
                          return true;
                        });
                        ESP_LOGI("vitals", "TWC vitals: A=%.2f B=%.2f C=%.2f vehicle=%.2f contactor=%s",
                            id(twc_vitals_current_a), id(twc_vitals_current_b), id(twc_vitals_current_c),
                            id(twc_vitals_vehicle_current), id(twc_vitals_contactor_closed) ? "closed" : "open");
                  else:
                    - logger.log:
                        format: "TWC vitals HTTP error: %d"
                        args: ["response->status_code"]

# ---------------------------------------------------------------------------
# HA diagnostics -- "connected" reflects the actual API connection to HA
# (not the time of the last value change), see api.on_client_disconnected above.
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: status
    name: "TWC HA Link OK"
