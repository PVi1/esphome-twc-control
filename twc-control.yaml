    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: "return id(ct2_current_a);"

  - platform: template
    name: "TWC Reported Current L3"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: "return id(ct3_current_a);"

  # --- Real measured data from Shelly (main incomer) ---
  - platform: template
