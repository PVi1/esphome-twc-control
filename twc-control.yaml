    update_interval: 2s
    lambda: "return id(twc_vitals_current_a);"

  - platform: template
    name: "TWC Vitals Current L2"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 2s
    lambda: "return id(twc_vitals_current_b);"

  - platform: template
    name: "TWC Vitals Current L3"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 2s
    lambda: "return id(twc_vitals_current_c);"

  - platform: template
    name: "TWC Vitals Vehicle Current"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 2s
    lambda: "return id(twc_vitals_vehicle_current);"

  # ---------------------------------------------------------------------------
  # Real per-phase current/power, mirrored in from HA entities (Shelly Pro 3EM
  # integration in HA) instead of polling Shelly's HTTP API directly. Avoids
  # Shelly Gen2's brute-force login protection entirely (see the old
  # switch.*_shelly_polling_enabled kill-switch this replaces) at the cost of
  # making HA a hard dependency for real-time power control, not just
  # start/stop -- if the API connection or these entities go stale, we fail
  # safe (see recompute_ct / ha_api_connected).
  #
  # "on_value" fires as soon as HA pushes a new state over the API
  # connection (real-time, not polled). ESPHome's homeassistant sensor
  # publishes NAN when the entity's HA state is "unavailable"/"unknown"
  # (fails to parse as a number) -- checked here to drive the matching
  # ha_*_available flag (see recompute_ct for the debounce that turns
  # this into the actual fail-safe decision). A valid value additionally
  # stamps shelly_last_ok_ms (informational only, see "Shelly Time Since
  # Last OK").
  # ---------------------------------------------------------------------------
  - platform: homeassistant
    id: ha_current_a
    entity_id: ${ha_current_a_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("shelly", "%s reported unavailable", "${ha_current_a_entity}");
              id(ha_current_a_available) = false;
            } else {
              // Anti-glitch (asymmetric, see glitch_drop_a above): a rise
              // (or a gentle drop) is trusted immediately; a sudden drop
              // needs 2 consecutive samples to agree before being
              // believed (confirmed live: a single stale/desynced sample
              // dropped >4A in <10ms, physically impossible for a real
              // ramp).
              const float drop_a = ${glitch_drop_a};
              const float tol_a = ${glitch_confirm_tol_a};
              if (x >= id(real_a_trusted) - drop_a) {
                id(real_a_pending_drop) = NAN;
                id(real_a_confirm_count) = 0;
                id(real_a_trusted) = x;
              } else {
                if (std::isnan(id(real_a_pending_drop)) || fabsf(x - id(real_a_pending_drop)) > tol_a) {
                  id(real_a_pending_drop) = x;
                  id(real_a_confirm_count) = 1;
                } else {
                  id(real_a_confirm_count)++;
                }
                if (id(real_a_confirm_count) >= 2) {
                  id(real_a_trusted) = std::min(x, id(real_a_pending_drop));
                  id(real_a_pending_drop) = NAN;
                  id(real_a_confirm_count) = 0;
                }
              }
              id(shelly_a_current) = id(real_a_trusted);
              id(shelly_last_ok_ms) = millis();
              id(ha_current_a_available) = true;
            }
        - script.execute: recompute_ct
  - platform: homeassistant
    id: ha_current_b
    entity_id: ${ha_current_b_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("shelly", "%s reported unavailable", "${ha_current_b_entity}");
              id(ha_current_b_available) = false;
            } else {
              // Anti-glitch -- see ha_current_a's on_value above.
              const float drop_a = ${glitch_drop_a};
              const float tol_a = ${glitch_confirm_tol_a};
              if (x >= id(real_b_trusted) - drop_a) {
                id(real_b_pending_drop) = NAN;
                id(real_b_confirm_count) = 0;
                id(real_b_trusted) = x;
              } else {
                if (std::isnan(id(real_b_pending_drop)) || fabsf(x - id(real_b_pending_drop)) > tol_a) {
                  id(real_b_pending_drop) = x;
                  id(real_b_confirm_count) = 1;
                } else {
                  id(real_b_confirm_count)++;
                }
                if (id(real_b_confirm_count) >= 2) {
                  id(real_b_trusted) = std::min(x, id(real_b_pending_drop));
                  id(real_b_pending_drop) = NAN;
                  id(real_b_confirm_count) = 0;
                }
              }
              id(shelly_b_current) = id(real_b_trusted);
              id(shelly_last_ok_ms) = millis();
              id(ha_current_b_available) = true;
            }
        - script.execute: recompute_ct
  - platform: homeassistant
    id: ha_current_c
    entity_id: ${ha_current_c_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("shelly", "%s reported unavailable", "${ha_current_c_entity}");
              id(ha_current_c_available) = false;
            } else {
              // Anti-glitch -- see ha_current_a's on_value above.
              const float drop_a = ${glitch_drop_a};
              const float tol_a = ${glitch_confirm_tol_a};
              if (x >= id(real_c_trusted) - drop_a) {
                id(real_c_pending_drop) = NAN;
                id(real_c_confirm_count) = 0;
                id(real_c_trusted) = x;
              } else {
                if (std::isnan(id(real_c_pending_drop)) || fabsf(x - id(real_c_pending_drop)) > tol_a) {
                  id(real_c_pending_drop) = x;
                  id(real_c_confirm_count) = 1;
                } else {
                  id(real_c_confirm_count)++;
                }
                if (id(real_c_confirm_count) >= 2) {
                  id(real_c_trusted) = std::min(x, id(real_c_pending_drop));
                  id(real_c_pending_drop) = NAN;
                  id(real_c_confirm_count) = 0;
                }
              }
              id(shelly_c_current) = id(real_c_trusted);
              id(shelly_last_ok_ms) = millis();
              id(ha_current_c_available) = true;
            }
        - script.execute: recompute_ct
  # act_power: negative = export to grid, positive = import from grid (same convention as before)
  - platform: homeassistant
    id: ha_power_a
    entity_id: ${ha_power_a_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("shelly", "%s reported unavailable", "${ha_power_a_entity}");
              id(ha_power_a_available) = false;
            } else {
              id(shelly_a_power) = x;
              id(shelly_last_ok_ms) = millis();
              id(ha_power_a_available) = true;
            }
        - script.execute: recompute_ct
  - platform: homeassistant
    id: ha_power_b
    entity_id: ${ha_power_b_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("shelly", "%s reported unavailable", "${ha_power_b_entity}");
              id(ha_power_b_available) = false;
            } else {
              id(shelly_b_power) = x;
              id(shelly_last_ok_ms) = millis();
              id(ha_power_b_available) = true;
            }
        - script.execute: recompute_ct
  - platform: homeassistant
    id: ha_power_c
    entity_id: ${ha_power_c_entity}
    internal: true
    on_value:
      then:
        - lambda: |-
            if (std::isnan(x)) {
              ESP_LOGW("shelly", "%s reported unavailable", "${ha_power_c_entity}");
              id(ha_power_c_available) = false;
            } else {
              id(shelly_c_power) = x;
              id(shelly_last_ok_ms) = millis();
              id(ha_power_c_available) = true;
            }
        - script.execute: recompute_ct

  - platform: template
    name: "TWC Reported Current L1"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: "return id(ct1_current_a);"

  - platform: template
    name: "TWC Reported Current L2"
    unit_of_measurement: "A"
